# ============================================================================
# 混合策略标准配比
# ============================================================================
mixed_strategies:
  pure_A:    [1.0, 0.0, 0.0]
  pure_B:    [0.0, 1.0, 0.0]
  pure_C:    [0.0, 0.0, 1.0]
  A_dominant_B: [0.7, 0.2, 0.1]
  A_dominant_C: [0.7, 0.1, 0.2]
  B_dominant_A: [0.2, 0.7, 0.1]
  B_dominant_C: [0.1, 0.7, 0.2]
  C_dominant_A: [0.2, 0.1, 0.7]
  C_dominant_B: [0.1, 0.2, 0.7]
  A_B_balanced: [0.70, 0.30, 0.0]
  A_C_balanced: [0.70, 0.0, 0.30]
  B_C_balanced: [0.0, 0.70, 0.30]
  uniform:      [0.50, 0.30, 0.20]

  # 混合策略约束规则
  constraints:
    min_dominant: 0.50    # 主导策略最低权重
    max_secondary: 0.30   # 次要策略最高权重
    max_tertiary: 0.20    # 第三策略最高权重
    enforce: true         # 是否强制执行约束


# ============================================================================
# 参数定义域参考 (机器可读)
# ============================================================================
# 用途: 供自动化采样脚本（Sobol/LHS/贝叶斯优化）直接读取，无需从schema.py导入。
# 所有参数名与上方配置节中的键名完全一致。
# 注意: schema.py中的ParamDef.domain是数据的权威来源，此处为便捷副本。
# ============================================================================
param_domains:
  # ── 生产函数 ──
  sigma_b:              {min: 0.3,  max: 1.5}
  theta_b:              {min: 0.2,  max: 0.5}
  lambda_b:             {min: 0.3,  max: 1.5}
  alpha_i:              {min: 0.3,  max: 0.6}
  gamma_i:              {min: 0.05, max: 0.35}
  mu_i:                 {min: 0.3,  max: 1.0}
  alpha_d_infra:        {min: 0.35, max: 0.65}
  alpha_d_app:          {min: 0.15, max: 0.40}
  alpha_s_high:         {min: 0.20, max: 0.45}
  alpha_s_low:          {min: 0.05, max: 0.25}
  xi_infra_to_app:      {min: 0.1,  max: 0.5}
  eta_network_app:      {min: 0.1,  max: 0.6}
  platform_empowerment: {min: 0.1,  max: 0.7}

  # ── 数字化增益 ──
  alpha_b_dig:  {min: 0.1, max: 0.6}
  alpha_i_dig:  {min: 0.3, max: 1.5}
  beta_b_dig:   {min: 0.3, max: 0.8}
  beta_i_dig:   {min: 0.3, max: 0.8}
  alpha_s_dig:  {min: 0.2, max: 0.8}
  beta_s_dig:   {min: 0.3, max: 0.8}
  eta_network:  {min: 0.0, max: 0.5}

  # ── 折旧率 ──
  delta_b:       {min: 0.03, max: 0.10}
  delta_i:       {min: 0.05, max: 0.15}
  delta_d_infra: {min: 0.03, max: 0.10}
  delta_d_app:   {min: 0.10, max: 0.30}
  delta_s_high:  {min: 0.03, max: 0.08}
  delta_s_low:   {min: 0.05, max: 0.12}

  # ── 投资吸收 ──
  nu_b:       {min: 0.1,  max: 0.5}
  nu_i:       {min: 0.2,  max: 0.6}
  nu_d_infra: {min: 0.08, max: 0.35}
  nu_d_app:   {min: 0.15, max: 0.45}
  nu_s_high:  {min: 0.15, max: 0.55}
  nu_s_low:   {min: 0.1,  max: 0.45}
  chi_absorb: {min: 0.3,  max: 1.5}

  # ── 劳动力 ──
  lambda_flow: {min: 0.01, max: 0.15}
  sigma_skill: {min: 0.1,  max: 0.5}
  bp_base:     {min: 0.3,  max: 0.8}

  # ── 技术追赶 ──
  zeta_d:           {min: 0.01, max: 0.10}
  phi_rd:           {min: 0.3,  max: 0.8}
  chi_absorb_tech:  {min: 0.02, max: 0.20}
  xi_gap:           {min: 0.3,  max: 1.5}
  G_critical:       {min: 3.0,  max: 20.0}
  lambda_trap:      {min: 0.1,  max: 1.0}
  lambda_dep:       {min: 0.0,  max: 1.0}
  chi_spont:        {min: 0.01, max: 0.10}
  eta_diff:         {min: 0.5,  max: 3.0}
  diff_policy_intensity: {min: 0.0, max: 0.15}

  # ── 国际 ──
  theta_p:         {min: 0.1,  max: 0.5}
  sigma_p:         {min: 0.05, max: 0.40}
  block_max:       {min: 0.0,  max: 0.9}
  fdi_sensitivity: {min: 0.5,  max: 3.0}

  # ── 福利 ──
  epsilon_welfare: {min: 0.5, max: 2.5}


    H_d_app: 1.1
    H_s_high: 1.0
    H_s_low: 0.6
    # 部门初始数字化水平
    DL_b: 0.03
    DL_i: 0.08
    DL_d: 0.10
    DL_d_infra: 0.05
    DL_d_app: 0.12
    DL_s_high: 0.08
    DL_s_low: 0.05
    # 部门初始技术水平
    A_b: 1.0
    A_i: 1.3
    A_d: 1.5
    A_d_infra: 1.1
    A_d_app: 1.6
    A_s_high: 1.1
    A_s_low: 0.8
    # 部门初始工资
    W_b: 2.0
    W_i: 3.5
    W_d: 6.0

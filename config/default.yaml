# ============================================================================
# 理论来源对照表
# ============================================================================
# 用途: 回应"参数从哪来"的学术审阅。标注每个参数的经济学文献依据。
# 格式: 参数名: [来源类型] 简短引用
# ============================================================================
parameter_sources:
  # ── 生产函数 ──
  sigma_b:              "[经验估计] Fuglie (2018) 农业CES替代弹性"
  theta_b:              "[经验估计] 发展中国家农业资本份额 (World Bank WDI)"
  alpha_i:              "[经验估计] 制造业资本份额 0.3-0.6 (Gollin 2002)"
  alpha_d_infra:        "[经验估计] 芯片/数据中心资本密集 (SEMI industry data)"
  alpha_d_app:          "[经验估计] 软件/平台劳动密集 (Autor et al. 2020)"
  alpha_s_high:         "[经验估计] 金融/研发行业资本份额 (BEA)"
  alpha_s_low:          "[经验估计] 零售/餐饮低资本密集 (BEA)"
  xi_infra_to_app:      "[模型假设] infra→app技术约束弹性"
  eta_network_app:      "[理论依据] 网络效应经济学 (Katz & Shapiro 1985)"

  # ── 数字化 ──
  alpha_i_dig:          "[理论依据] 工业4.0数字化增益 (Brynjolfsson & Hitt 2003)"
  beta_i_dig:           "[理论依据] IT投资回报递减 (Solow paradox修正)"

  # ── 折旧率 ──
  delta_i:              "[统计数据] 制造业设备折旧 (BEA Fixed Assets, 8%/年)"
  delta_d_app:          "[统计数据] 软件折旧 (BEA, 软件3-5年寿命→20%/年)"
  delta_d_infra:        "[统计数据] 硬件设施 (BEA, 数据中心20年寿命→5%/年)"

  # ── 劳动力 ──
  lambda_flow:          "[理论依据] 部门间劳动力流动 (Lucas & Prescott 1974)"
  sigma_skill:          "[理论依据] 技能匹配摩擦 (Jovanovic 1979)"
  bp_base:              "[理论依据] 工资谈判力 (Blanchard & Gali 2010)"

  # ── 技术追赶 ──
  zeta_d:               "[经验估计] 发展中国家TFP增速1-4%/年 (Griliches 1998)"
  G_critical:           "[经验估计] 中等收入陷阱临界 (Eichengreen et al. 2013)"
  lambda_trap:          "[理论依据] 追赶陷阱衰减 (Acemoglu et al. 2006)"
  lambda_dep:           "[理论依据] 依附→自主创新压制 (Lall 2000)"
  chi_spont:            "[理论依据] 技术扩散S曲线 (Geroski 2000)"
  eta_diff:             "[理论依据] 吸收能力的人力资本约束 (Nelson & Phelps 1966)"

  # ── 国际 ──
  sigma_p:              "[经验估计] 大宗商品价格波动 (IMF WEO)"
  block_max:            "[模型假设] 技术封锁强度参数化"
  fdi_sensitivity:      "[理论依据] FDI对利差弹性 (Feldstein & Horioka 1980)"

  # ── 福利 ──
  epsilon_welfare:      "[理论依据] Atkinson (1970) 不平等厌恶参数 [0.5, 2.0]"
  consumption_propensity: "[经验估计] 发展中国家消费倾向 0.80-0.90 (WDI)"

  # ── 策略B ──
  B_tau_baseline:       "[经验估计] Okun定律 (Okun 1962) → 1%超额提取≈0.05%就业流失"
  B_disposable_income_base: "[经验估计] 发展中国家劳动收入份额0.65-0.80 (Gollin 2002)"

  # ── 平台垄断 ──
  anti_monopoly_policy: "[理论依据] Philippon (2019) 市场竞争度下降 + 反垄断政策"

  # ── 人口 ──
  IC_fertility_rate:    "[统计数据] UN Population Division 发展中国家TFR 2.5"
  IC_life_expectancy:   "[统计数据] UN Population Division 发展中国家LE 65岁"

  # ── 空间 ──
  agglomeration_strength: "[理论依据] Krugman (1991) 新经济地理学集聚效应"
  migration_cost_index:   "[理论依据] Harris & Todaro (1970) 城乡迁移摩擦"

  # ── 政治经济学 ──
  support_smoothing_factor: "[理论依据] Acemoglu & Robinson (2006) 政治经济学框架"


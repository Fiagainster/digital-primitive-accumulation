# ============================================================================
# 原始积累模型 (Primitive Accumulation Model) v3.7
# 默认参数配置文件
# ============================================================================
# 用途: 统一管理模型所有参数、权重和初始条件。
# 加载方式:
#   python main.py demo --config config/default.yaml
#   python main.py demo --config config/custom.yaml --profile digital_leapfrogger
#
# 优先级 (从低到高):
#   本文件默认值 → 国情预设 → 国际场景 → 命令行/用户覆盖
# ============================================================================

model:
  version: "3.7"
  description: "六部门政治经济学模拟实验室 —— 数字时代原始积累的可行路径、多维评价与代价分布"

# ============================================================================
# L1: 结构参数 (Structural Parameters)
# ============================================================================
structural:

  # --- 生产函数: 基础部门 (b) ---
  production_base:
    sigma_b: 0.8              # σ_b: 替代弹性 [0.3, 1.5]
    theta_b: 0.35             # θ_b: 资本份额 [0.2, 0.5]
    alpha_b_dig: 0.3          # α_b^dig: 数字化最大增益 [0.1, 0.6]
    beta_b_dig: 0.5           # β_b^dig: 数字化弹性 [0.3, 0.8]
    lambda_b: 0.8             # λ_b: 资源约束弹性 [0.3, 1.5]

  # --- 生产函数: 工业部门 (i) ---
  production_industry:
    alpha_i: 0.45             # α_i: 资本产出弹性 [0.3, 0.6]
    alpha_i_dig: 0.8          # α_i^dig: 数字化最大增益 [0.3, 1.5]
    beta_i_dig: 0.5           # β_i^dig: 数字化弹性 [0.3, 0.8]
    gamma_i: 0.15             # γ_i: 数字服务对工业产出弹性 [0.05, 0.35]
    mu_i: 0.7                 # μ_i: 原材料约束弹性 [0.3, 1.0]

  # --- 生产函数: 数字基础设施层 (d_infra) ---
  production_d_infra:
    alpha_d_infra: 0.55       # α_di: 资本产出弹性 [0.35, 0.65]
    delta_d_infra_hw: 0.20    # δ_di^hw: 硬件对infra产出弹性 [0.05, 0.30]

  # --- 生产函数: 数字应用层 (d_app) ---
  production_d_app:
    alpha_d_app: 0.30         # α_da: 资本产出弹性 [0.15, 0.40]
    delta_d_app_data: 0.25    # δ_da^data: 数据对app产出弹性 [0.10, 0.40]
    eta_network_app: 0.35     # η_net^app: 应用层网络效应强度 [0.1, 0.6]
    xi_infra_to_app: 0.30     # ξ_infra→app: infra→app技术约束弹性 [0.1, 0.5]

  # --- 生产函数: 高技能服务业 (s_high) ---
  production_s_high:
    alpha_s_high: 0.35        # α_sh: 资本产出弹性 [0.20, 0.45]
    xi_s_digital_link: 0.30   # ξ_s^link: 数字-高技能服务关联弹性 [0.1, 0.5]

  # --- 生产函数: 低端服务业 (s_low) ---
  production_s_low:
    alpha_s_low: 0.15         # α_sl: 资本产出弹性 [0.05, 0.25]
    platform_empowerment: 0.40 # φ_plat: 数字平台赋能强度 [0.1, 0.7]

  # --- 数字化增益 (跨部门共用) ---
  digitalization_common:
    alpha_s_dig: 0.5          # α_s^dig: 服务业数字化最大增益 [0.2, 0.8]
    beta_s_dig: 0.5           # β_s^dig: 服务业数字化弹性 [0.3, 0.8]
    eta_network: 0.2          # η_net: 网络效应强度(低端服务) [0.0, 0.5]

  # --- 兼容旧参数 (与上述新参数共存) ---
  legacy_compat:
    alpha_b: 0.35             # 已在production_base中定义
    alpha_d: 0.25             # 数字部门资本产出弹性(兼容旧参数)
    delta_d_hw: 0.15          # 硬件对数字部门产出弹性(兼容)
    epsilon_d: 0.15           # 数据存量弹性(兼容)
    alpha_s: 0.25             # 服务业资本产出弹性(兼容)
    delta_s: 0.05             # 服务业折旧率(兼容)
    nu_d: 0.25                # 数字部门投资吸收率(兼容)
    nu_s: 0.35                # 服务业投资吸收率(兼容)

  # --- 折旧率 ---
  depreciation:
    delta_b: 0.05             # 基础部门: 农业设备/土地
    delta_i: 0.08             # 工业部门: 制造业设备
    delta_d: 0.20             # 旧数字部门(兼容)
    delta_d_infra: 0.05       # 数字infra: 芯片/数据中心(长寿命硬件)
    delta_d_app: 0.20         # 数字app: 软件快速迭代
    delta_s_high: 0.05        # 高技能服务: 办公楼/设备
    delta_s_low: 0.08         # 低端服务: 零售设备

  # --- 投资吸收能力 ---
  absorption:
    nu_b: 0.3                 # 基础部门投资吸收率 [0.1, 0.5]
    nu_i: 0.4                 # 工业部门投资吸收率 [0.2, 0.6]
    nu_d_infra: 0.20          # 数字infra投资吸收率 [0.08, 0.35]
    nu_d_app: 0.30            # 数字app投资吸收率 [0.15, 0.45]
    nu_s_high: 0.40           # 高技能服务投资吸收率 [0.15, 0.55]
    nu_s_low: 0.30            # 低端服务投资吸收率 [0.1, 0.45]
    chi_absorb: 0.8           # 人力资本对吸收能力弹性 [0.3, 1.5]
    psi_obsolescence: 0.1     # 技术淘汰系数 [0.0, 0.3]

  # --- v3.7: 生产系数 (跨部门原材料/硬件/网络效应等) ---
  production_coefficients:
    # 工业原材料约束
    M_needed_ratio: 0.1           # 每单位工业资本所需原材料 [0.05, 0.20]
    M_avail_ratio: 0.3            # 基础部门产出中可用的原材料比例 [0.1, 0.5]
    # 数字infra硬件约束
    HW_needed_ratio: 0.08         # 每单位infra资本所需硬件 [0.03, 0.15]
    HW_avail_ratio_i: 0.2         # 工业产出中可用的硬件供给比例 [0.1, 0.4]
    HW_avail_floor: 0.1           # 硬件供给最低保障 [0.05, 0.20]
    # 进口依赖
    import_penalty_factor: 0.4    # 进口依赖对infra产出的惩罚乘数 [0.2, 0.6]
    # d_app网络效应
    d_app_users_per_L: 15         # 每单位劳动力对应app用户数 [5, 30]
    d_app_users_min: 50.0         # 网络效应最低用户门槛 [10.0, 200.0]
    d_app_net_effect_cap: 2.5     # 网络效应最大乘数 [1.0, 5.0]
    d_app_min_A_effective: 0.6    # infra约束下app最低有效技术水平 [0.3, 0.8]
    # s_low平台赋能
    s_low_users_per_L: 10         # 每单位劳动力对应平台用户数 [3, 20]
    s_low_users_min: 30.0         # 平台网络效应最低用户门槛 [10.0, 100.0]
    s_low_net_effect_cap: 1.0     # s_low网络效应最大乘数 [0.5, 2.0]
    s_low_net_effect_weight: 0.3  # 网络效应在s_low产出中的权重 [0.1, 0.5]
    # s_high数字密度增益
    s_high_density_gain_factor: 0.40  # 数字密度对s_high产出增益因子 [0.1, 0.6]
    # s_low平台饱和
    s_low_platform_saturation_start: 0.8      # 平台赋能饱和起始DL阈值 [0.6, 0.9]
    s_low_platform_saturation_decay: 0.3      # 饱和衰减率 [0.1, 0.5]
    s_low_platform_saturation_range: 0.2      # 饱和过渡区间宽度 [0.1, 0.3]
    s_low_platform_saturation_floor: 0.5      # 饱和后最低赋能乘数 [0.3, 0.7]

  # --- v3.7: 积累系数 (投资/信贷/吸收等) ---
  accumulation_coefficients:
    gov_consumption_share: 0.1        # 政府消费占GDP比例 [0.05, 0.20]
    accumulation_fund_share: 0.8      # 积累基金占总剩余比例 [0.5, 0.95]
    credit_ext_dep_factor: 0.4        # 外部依赖对信贷可得性惩罚因子 [0.2, 0.6]
    credit_availability_min: 0.25     # 信贷可得性下限 [0.1, 0.5]
    credit_availability_max: 1.0      # 信贷可得性上限 [0.8, 1.2]
    # 吸收能力
    absorb_DL_bonus_factor: 0.5       # 数字化水平对吸收能力加成 [0.2, 0.8]
    absorb_H_reference: 0.5           # 人力资本参考水平(H归一化基准) [0.3, 0.8]
    # 数字投资份额
    digital_share_i: 0.3              # 工业部门投资中数字技术占比 [0.1, 0.5]
    digital_share_b: 0.15             # 基础部门投资中数字技术占比 [0.05, 0.3]
    digital_share_other: 0.5          # 其他部门投资中数字技术占比 [0.2, 0.7]
    # 淘汰与下限
    obsolescence_delta_threshold: 0.05  # 折旧率低于此值触发技术淘汰 [0.02, 0.10]
    K_floor: 0.01                     # 资本存量最低值(防零除) [0.001, 0.05]

  # --- 劳动力市场 ---
  labor_market:
    lambda_flow: 0.05         # 基础流动概率 [0.01, 0.15]
    sigma_skill: 0.25         # 技能匹配敏感度 [0.1, 0.5]
    lambda_cost: 1.0          # 转移成本敏感度 [0.5, 3.0]
    bp_base: 0.5              # 基础谈判力(base bargaining power) [0.3, 0.8]
    # 失业者再就业 (Pissarides匹配函数, v3.7)
    job_finding_base_rate: 0.15  # 基础求职成功率

    # --- v3.7: 劳动力市场扩展参数 ---
    wage_tightness_floor: 0.3         # 工资谈判力紧度最低值 [0.1, 0.5]
    labor_flow_dt_scale: 0.5          # 劳动力流动H变化阻尼系数 [0.1, 1.0]
    labor_flow_L_floor: 0.5           # 部门最低劳动力(防零除) [0.1, 1.0]
    h_min: 0.2                        # 人力资本下限 [0.1, 0.5]
    h_max: 3.0                        # 人力资本上限 [2.0, 5.0]
    unemployment_cost_rate: 3.0       # 每失业者基础成本(×工资平均) [1.0, 5.0]

    # 非正式就业
    informal_wage_ratio: 0.6                    # 非正式工资/基础工资比 [0.3, 0.8]
    informal_ratio_saturation: 0.25             # 非正式就业饱和阈值 [0.15, 0.40]
    saturated_back_to_base_ratio: 0.4           # 饱和时回流基础部门比例 [0.2, 0.6]
    saturated_labor_surplus_max: 0.2            # 劳动力过剩对工资最大惩罚 [0.1, 0.3]
    saturated_labor_surplus_coefficient: 0.15   # 劳动力过剩惩罚系数 [0.05, 0.25]

    # 非正式→正式回流
    informal_reflow_unsaturated: 0.05      # 未饱和时年回流率 [0.02, 0.10]
    informal_reflow_near_saturated: 0.03   # 接近饱和时年回流率 [0.01, 0.06]
    informal_reflow_saturated: 0.015       # 已饱和时年回流率 [0.005, 0.03]
    informal_reflow_formal_success: 0.3    # 回流正式就业成功率 [0.1, 0.5]

    # 技能折旧
    digital_skill_obsolescence_rate: 0.06      # 数字技能年折旧率 [0.02, 0.12]
    industrial_skill_erosion_rate: 0.025       # 工业技能年侵蚀率 [0.01, 0.05]
    industrial_skill_erosion_max: 0.30         # 工业技能最大侵蚀比例 [0.1, 0.5]

    # 技能选择效应
    skill_selection_base: 0.3              # 技能选择基础强度 [0.1, 0.5]
    skill_selection_match_factor: 0.7      # 技能匹配因子 [0.3, 0.9]

  # --- 技术追赶 ---
  technology:
    zeta_d: 0.03              # 自主创新系数 [0.01, 0.10]
    phi_rd: 0.5               # 研发投入弹性 [0.3, 0.8]
    chi_absorb_tech: 0.08     # 技术吸收系数 [0.02, 0.20]
    xi_gap: 0.8               # 技术差距弹性 [0.3, 1.5]
    G_critical: 8.0           # 追赶陷阱临界差距 [3.0, 20.0]
    lambda_trap: 0.3          # 陷阱衰减速度 [0.1, 1.0]
    phi_trap: 0.2             # 依赖陷阱强度 [0.0, 0.5]
    lambda_dep: 0.5           # 依附对自主创新抑制强度 [0.0, 1.0]

    # --- v3.7: 技术追赶扩展参数 ---
    world_frontier_infra_weight: 0.4   # 世界前沿infra技术权重 [0.2, 0.6]
    world_frontier_app_weight: 0.6     # 世界前沿app技术权重 [0.4, 0.8]

    # --- v3.7.4: 非线性追赶模式（稳健性检验） ---
    catchup_mode: linear                # 追赶模式: linear(默认), logistic, piecewise
    catchup_max_gap: 10.0              # logistic模式: S曲线饱和差距 [5.0, 20.0]
    catchup_piecewise_threshold: 3.0   # piecewise模式: 分段阈值 [2.0, 8.0]
    catchup_piecewise_boost: 2.0       # piecewise模式: 远距离加速倍数 [1.5, 4.0]

  # --- 知识扩散 ---
  diffusion:
    chi_spont: 0.04           # 自发扩散系数 [0.01, 0.10]
    eta_diff: 1.5             # 人力资本对扩散敏感度 [0.5, 3.0]

  # --- 国际 ---
  international:
    theta_p: 0.3              # 资源价格均值回复速度 [0.1, 0.5]
    sigma_p: 0.15             # 资源价格波动率 [0.05, 0.40]
    block_max: 0.5            # 最大技术封锁溢价 [0.0, 0.9]
    fdi_sensitivity: 1.5      # 外资对回报率敏感度 [0.5, 3.0]

    # --- v3.7: 国际参数扩展 ---
    rer_resource_share_coefficient: 0.8    # 资源占比对汇率影响系数 [0.3, 1.5]
    rer_min: 0.5                           # 汇率下限 [0.3, 0.8]
    rer_max: 3.0                           # 汇率上限 [2.0, 5.0]
    export_resource_price_factor: 0.5      # 资源出口价格因子 [0.3, 0.8]
    digital_export_share: 0.2              # 数字出口占数字产出比 [0.1, 0.4]
    fdi_inflow_gdp_share: 0.05             # FDI流入占GDP基准比 [0.01, 0.10]
    fdi_outflow_rate: 0.08                 # FDI利润汇出率 [0.03, 0.15]
    tech_import_gdp_share: 0.1             # 技术进口占GDP基准比 [0.05, 0.20]
    blockade_sigmoid_steep: 5.0            # 封锁sigmoid函数陡度 [2.0, 10.0]
    blockade_sigmoid_mid: 3.0              # 封锁sigmoid中点(G值) [1.0, 6.0]

  # --- 福利 ---
  welfare:
    epsilon_welfare: 1.5      # 福利分量替代弹性(Atkinson不平等厌恶) [0.5, 2.5]
                              # v3.7: 从3.0降至1.5, 避免数学不稳定
    data_depreciation: 0.15   # 数据折旧率 [0.05, 0.30]

    # --- v3.7: 福利参数扩展 ---
    welfare_consumption_exponent: 0.5    # 福利中消费指数权重 [0.3, 0.7]
    welfare_employment_exponent: 0.3     # 福利中就业指数权重 [0.1, 0.5]
    welfare_skill_exponent: 0.2          # 福利中技能指数权重 [0.1, 0.4]
    welfare_survival_floor: 0.01         # Sen能力底线(最低福利基准) [0.001, 0.05]
    consumption_propensity: 0.85         # 居民消费倾向 [0.7, 0.95]

  # --- 异质性数据 ---
  data_assets:
    phi_prod_data: 0.04       # 生产者数据生成率 [0.01, 0.10]
    phi_cons_data: 0.06       # 消费者数据生成率 [0.02, 0.15]
    gamma_cross_data: 0.2     # 消费者→生产者交叉弹性 [0.0, 0.5]

  # --- v3.5: 金融维度 ---
  financial:
    capital_flight_sensitivity: 0.15   # 资本外逃敏感度 [0.0, 0.5]
    asset_price_volatility: 0.25       # 数字资产价格波动率 [0.05, 0.50]
    credit_bias_digital: 1.3           # 信贷数字部门偏好乘数 [0.8, 1.8]
    credit_bias_industry: 0.8          # 信贷工业部门偏好乘数 [0.5, 1.2]
    housing_wealth_share: 0.45         # 房产在家庭财富中的基准占比 [0.2, 0.7]

  # --- v3.6: 内生人口 ---
  demography:
    IC_fertility_rate: 2.5       # 初始总和生育率 [1.1, 6.0]
    IC_life_expectancy: 65.0     # 初始预期寿命(年) [40.0, 85.0]
    IC_urbanization_rate: 0.35   # 初始城镇化率 [0.10, 0.90]
    IC_total_population: 7000.0  # 初始总人口(万人) [100.0, 150000.0]
    migration_cost_index: 0.30   # 劳动力空间流动摩擦成本 [0.0, 0.8]

  # --- v3.6: 双区域空间 ---
  spatial:
    coastal_productivity_premium: 0.20    # 沿海/城市生产率溢价 [0.05, 0.50]
    agglomeration_strength: 0.15          # 集聚经济强度 [0.0, 0.30]
    congestion_threshold: 0.60            # 拥挤成本触发阈值(沿海人口占比) [0.5, 0.8]
    IC_coastal_industry_share: 0.60       # 初始沿海工业份额 [0.3, 0.9]
    IC_coastal_digital_infra_share: 0.75  # 初始沿海数字infra份额 [0.4, 1.0]
    IC_coastal_digital_app_share: 0.80    # 初始沿海数字app份额 [0.4, 1.0]
    IC_coastal_population_share: 0.45     # 初始沿海人口份额 [0.15, 0.80]
    IC_urban_rural_productivity_ratio: 2.5 # 初始城乡生产率比 [1.2, 6.0]

  # --- v3.6: 政策执行折扣 ---
  policy_execution:
    bureaucracy_complexity_penalty: 0.15  # 官僚协调复杂度惩罚 [0.0, 0.3]
    policy_execution_base_efficiency: 0.75 # 政策执行基础效率 [0.5, 1.0]

  # --- v3.6: 通用初始条件 ---
  initial_conditions:
    IC_K_i: 300.0              # 初始工业资本存量 [50.0, 800.0]
    IC_tech_gap_initial: 3.0   # 初始技术差距 [1.5, 10.0]
    IC_gini_initial: 0.35      # 初始基尼系数 [0.15, 0.55]


# ============================================================================
# L2: 策略参数 (Strategy Parameters)
# ============================================================================
strategy:

  # --- 跨策略通用参数 ---
  common:
    tau_w: 0.15               # τ_w: 再分配力度(税率) [0.0, 0.5]
    kappa: 0.3                # κ: 规划强度(数字服务分配) [0.0, 1.0]
    pub_infra_invest: 0.1     # 公共数字基础设施投资占比 [0.0, 0.3]
    social_coverage: 0.5      # 社会保障覆盖率 [0.0, 1.0]
    training_invest: 0.01     # 培训投入占GDP比 [0.0, 0.05]
    diff_policy_intensity: 0.05 # ★ 知识扩散政策强度（权威参数）[0.0, 0.15]
    kappa_diff: 0.03          # ⚠ 旧参数名，已废弃。仅作回退安全网。修改扩散强度请改 diff_policy_intensity

  # --- 策略A: 渐进积累 ---
  A:
    A_tau_min: 0.08           # τ_min: 最低提取率 [0.05, 0.15] (v3.7.3: 0.05→0.08)
    A_tau_max: 0.30           # τ_max: 最高提取率 [0.15, 0.40] (v3.7.3: 0.20→0.30)
    A_theta_elasticity: 0.5   # θ_elas: 提取弹性 [0.1, 1.0]
    A_safety_margin: 1.5      # safety: 工业资本安全边际(乘数) [1.2, 2.5] (v3.7.3: 从分数0.7修正为乘法语义)
    A_phi_d_premium: 0.15     # φ_d_prem: 数字投资额外权重 [0.05, 0.25] (v3.7.3: 0.10→0.15)

    # --- 内生成本参数 ---
    protection_excess_coefficient: 0.04       # 保护过剩效率损失系数 [0.02, 0.10] (v3.7.3: 0.08→0.04)
    protection_excess_floor: 0.90             # 保护过剩时工业产出最低系数 [0.80, 0.95] (v3.7.3: 0.85→0.90)
    time_tax_accumulation_threshold: 0.1      # 时间税累积滞后触发阈值 [0.05, 0.20]
    time_tax_penalty_rate: 0.03               # 累积滞后惩罚率 [0.01, 0.06]
    time_tax_natural_buffer: 0.015            # 自然追赶缓冲(dt扣除, 防零滞后) [0.005, 0.03] (v3.7.3: 0.01→0.015)
    vested_interest_duration: 20.0            # 既得利益触发年限(保护持续时间) [10.0, 30.0] (v3.7.3: 15→20)
    vested_interest_coefficient: 0.01         # 既得利益强度系数 [0.005, 0.03]
    vested_interest_max_intensity: 0.5        # 既得利益最大强度(改革阻力上限) [0.2, 0.7]
    vested_interest_invest_floor: 0.5         # 既得利益下数字投资最低系数 [0.3, 0.7]
    middle_income_DD_threshold: 0.2           # 中间收入陷阱数字密度阈值 [0.1, 0.4] (v3.7.3: 0.3→0.2, 降低A的跨越门槛)
    middle_income_G_threshold: 4.0            # 中间收入陷阱技术差距阈值 [2.0, 8.0]
    middle_income_duration: 10.0              # 中间收入陷阱持续年限 [5.0, 20.0]
    middle_income_trap_penalty_rate: 0.01     # 中间收入陷阱年惩罚率 [0.005, 0.03]
    middle_income_K_floor: 0.90               # 中间收入陷阱下工业资本最低系数 [0.8, 0.95]
    middle_income_recovery_rate: 2.0          # 中间收入陷阱恢复速率(dt乘数) [1.0, 4.0]
    g_i_max: 0.5                              # 工业GDP占比最大阈值(提取率饱和点) [0.3, 0.7]
    A_extraction_floor_ratio: 0.3             # K_ratio低于安全边际时提取率最低乘数 [0.1, 0.5]

  # --- 策略B: 跳跃积累 ---
  B:
    B_g_target: 0.25          # g_target: 数字部门目标增长率 [0.10, 0.40]
    B_tau_ceiling: 0.40       # τ_ceil: 名义提取上限 [0.20, 0.60]
    B_tau_actual_max: 0.60    # τ_act_max: 实际可能提取上限 [0.30, 0.80]
    B_industry_tolerance: 0.5 # ind_tol: 工业萎缩容忍度 [0.3, 0.7]
    B_feedback_trigger: 0.5   # fb_trig: 反哺触发阈值(DL_d) [0.3, 0.7]
    B_feedback_ratio: 0.15    # fb_ratio: 反哺比例 [0.05, 0.30]
    B_phi_d_jump: 0.6         # φ_d_jump: 跳跃期数字投资份额 [0.4, 0.8]

    # --- 内生成本参数 ---
    B_infra_share_of_digital: 0.35          # 数字投资中infra占比 [0.2, 0.5]
    B_tau_baseline: 0.30                    # 就业破坏触发阈值(超额提取阈值) [0.15, 0.40]
    B_unemployment_coefficient: 0.05        # 超额提取→失业转化率 [0.02, 0.10]
    B_disposable_income_base: 0.70          # 基准可支配收入占比 [0.5, 0.85]
    B_disposable_income_tau_sens: 0.5       # 可支配收入对提取率敏感度 [0.2, 0.8]
    B_consumption_drag_coefficient: 0.15    # 消费萎缩→产出拖累系数 [0.05, 0.25]
    B_consumption_output_floor: 0.85        # 消费萎缩下工业产出最低系数 [0.7, 0.95]
    B_bubble_trigger_r: 0.25               # 泡沫触发利润率阈值 [0.15, 0.40]
    B_bubble_pressure_sensitivity: 0.3      # 利润率→泡沫压力敏感度 [0.1, 0.5]
    B_bubble_burst_base_prob: 0.003         # 泡沫破裂基础概率(每dt) [0.001, 0.01]
    B_bubble_decay_rate: 0.01               # 泡沫压力自然衰减率(r_d下降时) [0.005, 0.03]

    # --- 反哺机制参数 ---
    B_feedback_base_success: 0.85           # 反哺基础成功概率 [0.6, 0.95]
    B_feedback_profit_penalty_high: 0.20    # 高利润率惩罚(r>0.30) [0.10, 0.40]
    B_feedback_profit_penalty_mid: 0.10     # 中等利润率惩罚(r>0.20) [0.05, 0.20]
    B_feedback_min_success_prob: 0.15       # 反哺最低成功概率 [0.05, 0.30]
    B_feedback_max_success_prob: 0.95       # 反哺最高成功概率 [0.80, 0.99]
    B_feedback_execution_floor: 0.3         # 反哺最低执行率 [0.1, 0.5]
    B_feedback_resistance_coefficient: 0.15 # 反哺抵抗衰减系数 [0.05, 0.30]

    # --- 恐慌性提取参数 ---
    B_panic_extraction_G_threshold: 8.0     # 恐慌提取技术差距阈值 [5.0, 15.0]
    B_panic_extraction_K_ratio: 0.6         # 恐慌提取工业资本比阈值 [0.4, 0.8]
    B_panic_extraction_max_bonus: 0.15      # 恐慌提取最大加成(均匀分布上限) [0.05, 0.25]

    # --- 工业与软着陆 ---
    B_industry_tau_floor: 0.3               # 工业容忍度约束下提取率最低乘数 [0.1, 0.5]
    B_soft_landing_inst_cap: 0.7            # 软着陆制度能力阈值 [0.5, 0.9]
    B_soft_landing_bp_threshold: 3.0        # 软着陆泡沫压力阈值 [2.0, 5.0]
    B_soft_landing_bp_decay: 0.02           # 软着陆泡沫压力衰减率 [0.01, 0.04]

    # --- 泡沫破裂冲击尺度 ---
    B_d_infra_severity_scale: 0.6           # 泡沫破裂infra资本冲击尺度 [0.3, 0.8]
    B_d_app_severity_scale: 1.2             # 泡沫破裂app资本冲击尺度 [0.8, 1.5]

  # --- 策略C: 替代积累 ---
  C:
    C_resource_export_intensity: 0.6  # 资源出口强度 [0.3, 0.9]
    C_fdi_openness: 0.4               # 外资开放度 [0.1, 0.8]
    C_tech_import_preference: 0.6      # 技术进口偏好 [0.3, 0.9]
    C_indigenous_rd_ratio: 0.03        # 自主创新投入 [0.01, 0.10]
    C_profit_repat_limit: 0.3          # 利润汇出限制 [0.1, 0.7]
    C_foreign_debt_ceiling: 0.5        # 外债上限(占GDP) [0.2, 1.0]

    # --- 内生成本参数 ---
    C_base_extraction_rate: 0.25       # 基础提取率 [0.10, 0.40]
    C_digital_share_base: 0.25         # 数字投资基础份额 [0.10, 0.40]
    C_digital_share_fdi_factor: 0.15   # FDI对数字投资贡献因子 [0.05, 0.25]
    C_digital_share_tech_factor: 0.10  # 技术进口对数字投资贡献因子 [0.05, 0.20]
    C_infra_share_of_digital: 0.25     # 数字投资中infra占比 [0.15, 0.40]
    C_industry_base_share: 0.30        # 工业基础投资份额 [0.15, 0.45]
    C_dutch_disease_rer_coefficient: 0.5   # 荷兰病汇率→竞争力系数 [0.3, 0.7]
    C_policy_capture_threshold: 0.75       # 政策俘获触发阈值(外部依赖) [0.5, 0.9]
    C_tech_atrophy_threshold_tech: 0.6     # 技术退化: 技术进口阈值 [0.4, 0.8]
    C_tech_atrophy_threshold_dep: 0.6      # 技术退化: 外部依赖阈值 [0.4, 0.8]
    C_fdi_consumer_threshold: 0.5          # 消费主义陷阱FDI消费比阈值 [0.3, 0.7]

    # --- v3.7: 外部冲击与约束参数 ---
    C_resource_shock_tau_mult: 0.6         # 资源冲击时提取率乘数 [0.3, 0.8]
    C_resource_shock_phi_mult: 0.7         # 资源冲击时数字投资乘数 [0.4, 0.9]
    C_fdi_shock_effective_mult: 0.3        # FDI冲击时有效FDI乘数 [0.1, 0.5]
    C_d_app_max_share: 0.55                # d_app投资最大份额 [0.3, 0.7]
    C_phi_b_floor: 0.03                    # 基础部门投资最低份额 [0.01, 0.08]
    C_perfect_storm_inst_cap_mult: 1.5     # 完美风暴制度能力额外乘数 [1.0, 2.0]

  # --- v3.6: 平台垄断/反垄断 ---
  platform:
    anti_monopoly_policy: 0.2       # 反垄断执法力度 [0.0, 1.0]
    data_portability_mandate: 0.1   # 数据可携带权强度 [0.0, 1.0]
    platform_interoperability: 0.1  # 平台互操作性要求 [0.0, 1.0]


# ============================================================================
# L3: 场景参数 (Scenario Parameters) - 默认值
# ============================================================================
scenario_defaults:
  g_world: 0.03              # 国际技术前沿增长率 [0.01, 0.12]
  tech_frontier_ceiling_mult: 3.0  # v3.7.3: 国内TFP上限 = 前沿×此倍数 [1.5, 5.0]
  mu_p_resource: 1.0         # 长期资源均价水平 [0.3, 1.5]
  world_digital_demand: 1.0  # 国际数字需求水平 [0.3, 2.0]
  fdi_availability: 1.0      # 外资可得性 [0.1, 2.0]
  R_initial_ratio: 0.8       # 初始资源存量比 [0.2, 1.0]
  institution_capacity: 0.6  # 制度执行能力 [0.3, 1.0]

# ============================================================================
# 8种国际场景预设
# ============================================================================
scenarios:
  benign_globalization:
    description: "良性全球化：自由贸易、技术可得"
    g_world: 0.03
    block_max: 0.0
    mu_p_resource: 1.2
    sigma_p: 0.10
    world_digital_demand: 1.5
    fdi_availability: 1.5

  tech_cold_war:
    description: "技术冷战：高封锁、低FDI"
    g_world: 0.03
    block_max: 0.8
    mu_p_resource: 0.8
    sigma_p: 0.20
    world_digital_demand: 0.6
    fdi_availability: 0.2

  resource_crash:
    description: "资源价格崩溃"
    g_world: 0.02
    block_max: 0.2
    mu_p_resource: 0.3
    sigma_p: 0.40
    world_digital_demand: 0.8
    fdi_availability: 0.5

  tech_boom:
    description: "技术爆发：前沿快速前进"
    g_world: 0.08
    block_max: 0.4
    mu_p_resource: 1.0
    sigma_p: 0.15
    world_digital_demand: 2.0
    fdi_availability: 1.5

  global_recession:
    description: "全球衰退：需求萎缩"
    g_world: 0.01
    block_max: 0.3
    mu_p_resource: 0.5
    sigma_p: 0.30
    world_digital_demand: 0.3
    fdi_availability: 0.1

  full_containment:
    description: "全方位封锁：技术+资本+市场全面封锁"
    g_world: 0.05
    block_max: 0.95
    mu_p_resource: 0.4
    sigma_p: 0.35
    world_digital_demand: 0.1
    fdi_availability: 0.05

  tech_explosion:
    description: "技术爆发(AI奇点)：前沿指数跃升"
    g_world: 0.12
    block_max: 0.7
    mu_p_resource: 1.0
    sigma_p: 0.20
    world_digital_demand: 2.5
    fdi_availability: 1.0

  resource_war:
    description: "资源战争：价格剧烈波动+出口通道中断"
    g_world: 0.03
    block_max: 0.6
    mu_p_resource: 0.5
    sigma_p: 0.60
    world_digital_demand: 0.5
    fdi_availability: 0.15


# ============================================================================
# L4: 元参数 (Meta Parameters)
# ============================================================================
meta:
  # 断裂检测
  fracture:
    fracture_threshold_mult: 1.0    # 断裂阈值全局乘数 [0.7, 1.3]
    cascade_strength: 0.15          # 断裂级联强度 [0.05, 0.30]
    welfare_collapse_threshold: 0.30  # v3.7.4: 福利崩溃阈值 [0.10, 0.50]

  # v3.5: 混合策略互斥矩阵
  # 三维度: resource(资源逻辑冲突), institution(制度逻辑冲突), external(外部逻辑冲突)
  # total = (resource + institution + external) / 3
  incompatibility:
    AB:
      resource: 0.35       # M_AB_res: A↔B资源争夺互斥强度 [0.0, 0.6]
      institution: 0.25    # M_AB_inst: A↔B制度冲突互斥强度 [0.0, 0.5]
      external: 0.10       # M_AB_ext: A↔B外部矛盾互斥强度 [0.0, 0.4]
    BC:
      resource: 0.10       # M_BC_res: B↔C资源争夺互斥强度 [0.0, 0.3]
      institution: 0.30    # M_BC_inst: B↔C制度冲突互斥强度 [0.0, 0.5]
      external: 0.35       # M_BC_ext: B↔C外部矛盾互斥强度 [0.0, 0.6]
    AC:
      resource: 0.15       # M_AC_res: A↔C资源争夺互斥强度 [0.0, 0.4]
      institution: 0.20    # M_AC_inst: A↔C制度冲突互斥强度 [0.0, 0.4]
      external: 0.15       # M_AC_ext: A↔C外部矛盾互斥强度 [0.0, 0.4]

    # 调节变量
    moderation_inst: 0.30       # 制度能力对互斥的缓和系数 [0.0, 0.5]
    amplify_pressure: 0.20      # 外部压力对互斥的放大系数 [0.0, 0.4]
    # 混合互斥惩罚强度
    extraction_penalty: 0.3     # 提取率受互斥惩罚的比例
    investment_waste: 0.4       # 投资受互斥惩罚的浪费比例


# ============================================================================
# CDI权重方案 (五维评价综合发展指数)
# ============================================================================
cdi_weights:
  # 默认(民生优先): 论文默认定位
  default:
    economy: 0.175
    livelihood: 0.30
    resilience: 0.175
    structure: 0.175
    sovereignty: 0.175

  # 增长优先: 传统发展经济学视角
  growth_first:
    economy: 0.35
    livelihood: 0.20
    resilience: 0.15
    structure: 0.15
    sovereignty: 0.15

  # 民生极致: 最强调分配正义
  livelihood_first:
    economy: 0.10
    livelihood: 0.45
    resilience: 0.15
    structure: 0.15
    sovereignty: 0.15

  # 安全优先: 地缘政治紧张期视角
  security_first:
    economy: 0.10
    livelihood: 0.20
    resilience: 0.25
    structure: 0.15
    sovereignty: 0.30

  # 均衡发展: 无偏好的中性基准
  balanced:
    economy: 0.20
    livelihood: 0.20
    resilience: 0.20
    structure: 0.20
    sovereignty: 0.20

  # CDI时序参数
  temporal:
    discount_rate: 0.02       # 时序贴现率δ(年化)
    volatility_sigma_threshold: 0.05  # 波动惩罚触发阈值
    volatility_penalty_scale: 0.5     # 波动惩罚缩放因子


# ============================================================================
# 模拟运行配置 (SimulationConfig)
# ============================================================================
simulation:
  T_max: 100.0                  # 模拟总年数
  dt_base: 0.25                 # 基础步长(年)
  dt_min: 0.02                  # 最细步长(约1周)
  adaptive_stepping: true       # 是否使用自适应步长
  random_seed: 42               # 随机种子
  verbose: false                # 是否打印详细信息

  # EWS早期预警系统
  ews:
    window_size: 40               # 滑动窗口步数
    warning_threshold: 0.4        # 预警阈值
    critical_threshold: 0.7       # 临界阈值
    resilience_window: 60         # 韧性评估窗口
    resilience_weight: 0.35       # 韧性指数在综合EWS评分中的权重
    stress_duration_threshold: 30 # 连续高压步数阈值

  # 政治经济学反馈
  political_feedback:
    enabled: true
    update_interval: 1.0          # 政治支持度更新间隔(年)

  # SFC核算
  sfc:
    tolerance: 0.0001             # 会计闭合容差

  # 五维评价
  evaluation:
    enabled: true                 # 是否启用五维评价
    interval: 1.0                 # 评价更新间隔(年)
    cdi_weight_preset: "default"  # CDI权重预设方案
    red_line_check_enabled: true  # 是否启用人道主义红线检测

  # v3.6: 新模块开关
  modules:
    platform_enabled: true              # 平台垄断模块
    demography_enabled: true            # 内生人口动态
    demography_update_interval: 1.0     # 人口更新间隔(年)
    spatial_enabled: true               # 双区域空间模块
    policy_execution_discount_enabled: true  # 政策执行折扣


# ============================================================================
# 六种国情预设 (Country Profiles)
# ============================================================================
country_profiles:

  # --- 制造业大国 ---
